<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test qual="any" name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Amiri</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
</fontconfig>
