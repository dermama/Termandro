name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android toolchain
        run: |
          set -euo pipefail
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -d "$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          echo "SDK=$ANDROID_SDK_ROOT"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865"

      - name: Fetch Termux:X11 sources
        run: |
          set -euo pipefail
          rm -rf sources/termux-x11
          git clone --depth 1 https://github.com/termux/termux-x11.git sources/termux-x11
          git -C sources/termux-x11 fetch --depth 1 origin 5986cfc39458630dadd191735601cf2adc23a19f
          git -C sources/termux-x11 checkout --detach FETCH_HEAD
          git -C sources/termux-x11 submodule update --init --recursive
          git -C sources/termux-x11 apply "$GITHUB_WORKSPACE/patches/termux-x11-deck.patch"

      - name: Build native X11 test client
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
            -O2 -fPIE -pie -Wall -Wextra \
            -o app/src/main/assets/deck-xclient \
            tools/deck_xclient.c
          test -x app/src/main/assets/deck-xclient
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" version >/dev/null

      - name: Build Termux path hook
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
            -shared -fPIC -O2 -Wall -Wextra \
            -DNEW_PREFIX='"/data/user/0/com.deckos.core/files/usr"' \
            -o app/src/main/assets/libsocket_hook.so \
            app/src/main/cpp/socket_hook.c -llog
          test -s app/src/main/assets/libsocket_hook.so

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build debug APK
        run: |
          set -o pipefail
          ./gradlew \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" \
            :app:testDebugUnitTest :app:assembleDebug \
            --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Publish Gradle failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/gradle-build.log', 'utf8');
            } catch (error) {
              log = String(error);
            }
            const lines = log.split('\n');
            let start = lines.findIndex((line) => /^e: /.test(line));
            if (start < 0) start = lines.findIndex((line) => line.includes('error:'));
            if (start < 0) start = lines.findIndex((line) => line.includes('FAILURE:'));
            if (start < 0) start = Math.max(0, lines.length - 200);
            const details = lines.slice(start, start + 200).join('\n');
            await core.summary
              .addRaw('### Last Gradle output\n```text\n' + details + '\n```\n')
              .write();
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gradle-failure',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Gradle failure',
                summary: '```text\n' + details.slice(0, 60000) + '\n```',
              },
            });

      - name: Lint
        run: |
          ./gradlew \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" \
            :app:lintDebug --stacktrace --no-daemon

      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          entries="$(unzip -Z1 "$apk")"
          grep -qx 'lib/arm64-v8a/libXlorie.so' <<<"$entries"
          grep -qx 'lib/arm64-v8a/libtermux.so' <<<"$entries"
          grep -qx 'assets/deck-xclient' <<<"$entries"
          grep -qx 'assets/libsocket_hook.so' <<<"$entries"
          size="$(stat -c%s "$apk")"
          test "$size" -le $((70 * 1024 * 1024))
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$apk" > /tmp/apk-badging.txt
          grep -q "^package: name='com.deckos.core'" /tmp/apk-badging.txt
          grep -q "^launchable-activity: name='com.deckos.core.MainActivity'" /tmp/apk-badging.txt
          test "$(grep -c '^launchable-activity:' /tmp/apk-badging.txt)" -eq 1
          echo "APK=$apk"
          echo "SIZE=$size"

      - name: APK report
        run: ./scripts/apk-size-report.sh "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deckos-core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK as ci-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ci-latest >/dev/null 2>&1; then
            gh release create ci-latest --title "CI latest" --notes "Automated debug build" --prerelease
          fi
          gh release upload ci-latest app/build/outputs/apk/debug/app-debug.apk --clobber
